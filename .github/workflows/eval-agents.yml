# Subagent tool-tier evals — reusable workflow, called by evals.yml (never triggered directly).
# INFORMATIONAL: `continue-on-error: true` lives on the job here so this tier never gates a merge —
# it runs on google/gemini-2.5-flash via OpenRouter (headless CI has no Claude Code login), and
# tool-tier dispatch/activation checks are documented as flaky/indicative on non-Anthropic models
# (see evals/README.md). `max-parallel: 1` because concurrent OpenRouter calls under one API key can
# get throttled and degrade responses to truncated single-turn output.
name: eval-agents

on:
  workflow_call:
    inputs:
      agents:
        description: JSON array of agent names to run (from evals detect job)
        required: true
        type: string
    secrets:
      OPENROUTER_API_KEY:
        required: false

env:
  EVAL_BACKEND: openrouter
  EVAL_MODEL: google/gemini-2.5-flash
  EVAL_JUDGE_MODEL: google/gemini-2.5-flash
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

jobs:
  agents:
    name: agent evals (${{ matrix.agent }})
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: evals
    strategy:
      max-parallel: 1
      matrix:
        agent: ${{ fromJSON(inputs.agents) }}
    env:
      OPENROUTER_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: docker compose -f proxy/docker-compose.yml up -d

      - run: pnpm proxy:wait

      - run: pnpm vitest run "agents/${{ matrix.agent }}"

      - if: failure()
        run: docker compose -f proxy/docker-compose.yml logs --tail 100

      - if: always()
        run: docker compose -f proxy/docker-compose.yml down
