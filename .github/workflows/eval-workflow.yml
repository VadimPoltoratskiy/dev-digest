# Live-harness workflow-tier evals — reusable workflow, called by evals.yml (never triggered directly).
# INFORMATIONAL: `continue-on-error: true` lives on the job here so this tier never gates a merge.
# It loads the real harness and checks systemic behavior (subagent dispatch, skill activation,
# CLAUDE.md-driven reads) on google/gemini-2.5-flash via OpenRouter. The workflow tier's positive
# `activation` assertion is soft (warns, doesn't fail) on non-Anthropic models per evals/README.md.
name: eval-workflow

on:
  workflow_call:
    inputs:
      run_workflow:
        description: Whether to run the workflow tier (from evals detect job)
        required: true
        type: string
    secrets:
      OPENROUTER_API_KEY:
        required: false

env:
  EVAL_BACKEND: openrouter
  EVAL_MODEL: google/gemini-2.5-flash
  EVAL_JUDGE_MODEL: google/gemini-2.5-flash
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

jobs:
  workflow:
    name: workflow evals
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: evals
    env:
      OPENROUTER_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: docker compose -f proxy/docker-compose.yml up -d

      - run: pnpm proxy:wait

      - run: pnpm eval:workflow

      - if: failure()
        run: docker compose -f proxy/docker-compose.yml logs --tail 100

      - if: always()
        run: docker compose -f proxy/docker-compose.yml down
